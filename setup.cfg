[metadata]
name = agentkit-controller
version = attr: agentkit.__version__
description = Bounded engineering-agent orchestration and delivery evidence toolkit
long_description = file: README.md
long_description_content_type = text/markdown
author = Aditya Chaturvedi
author_email = chaturvediaditya910@gmail.com
url = https://github.com/adityachaturvedii/AgentKit

[options]
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
include = agentkit*

[options.entry_points]
console_scripts =
    agentkit = agentkit.__main__:main
